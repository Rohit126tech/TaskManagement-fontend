
<div class="dashboard-container">
  <header class="dashboard-header">
    <div class="header-content">
      <div class="logo-section">
        <h1>TaskMaster</h1>
        <span class="badge">Pro</span>
      </div>

      <div class="user-actions">
        <button (click)="toggleTheme()" class="btn-icon" [title]="isDarkMode ? 'Light Mode' : 'Dark Mode'">
          {{ isDarkMode ? '☀️' : '🌙' }}
        </button>

        <span class="user-welcome">
          Hello {{name}}
        </span>

        <button (click)="authService.logout()" class="btn-outline">Logout</button>
      </div>
    </div>
  </header>

  <div class="dashboard-main">

    <div class="actions-bar">
      <div class="search-filters">

        <div class="search-box">
          <input
            type="text"
            [ngModel]="searchQuery()"
            (ngModelChange)="searchQuery.set($event)"
            placeholder="Search tasks..."
          >
        </div>

        <select [ngModel]="statusFilter()" (ngModelChange)="statusFilter.set($event)">
          <option [ngValue]="null">All Statuses</option>
          <option value="Todo">Todo</option>
          <option value="In Progress">In Progress</option>
          <option value="Completed">Completed</option>
        </select>

        <select [ngModel]="priorityFilter()" (ngModelChange)="priorityFilter.set($event)">
          <option [ngValue]="null">All Priorities</option>
          <option value="Low">Low</option>
          <option value="Medium">Medium</option>
          <option value="High">High</option>
        </select>

      </div>

      <button (click)="openAddTask()" class="btn-primary">+ Add Task</button>
    </div>

    <!-- Loading -->
    <div *ngIf="isLoading()" class="loading-state">
      <div class="skeleton-list">
        <div class="skeleton-item" *ngFor="let i of [1,2,3]"></div>
      </div>
    </div>

    <!-- Empty -->
    <div *ngIf="!isLoading() && filteredTasks().length === 0" class="empty-state">
      <p>No tasks found. Try adjusting your filters or add a new task.</p>
    </div>

    <!-- Tasks -->
    <div *ngIf="!isLoading() && filteredTasks().length > 0" class="task-grid">

      <div class="task-card" *ngFor="let task of filteredTasks()">

        <div class="task-header">

          <span [class]="'priority-badge ' + getPriorityClass(task.priority)">
            {{ task.priority }}
          </span>

          <div class="task-actions">
            <button (click)="openEditTask(task)" title="Edit">✎</button>
            <button (click)="deleteTask(task._id)" title="Delete" class="delete">🗑</button>
          </div>

        </div>

        <h3 class="task-title">{{ task.title }}</h3>
        <p class="task-desc">{{ task.description }}</p>

        <div class="task-footer">

          <div class="task-meta">
            <span class="due-date">
              📅 {{ task.dueDate | date:'mediumDate' }}
            </span>
          </div>

          <div class="status-dropdown">
            <select
              [ngModel]="task.status"
              (ngModelChange)="updateStatus(task, $event)"
              [class]="getStatusClass(task.status)"
            >
              <option value="Todo">Todo</option>
              <option value="In Progress">In Progress</option>
              <option value="Completed">Completed</option>
            </select>
          </div>

        </div>

      </div>
    </div>

  </div>

  <!-- Modal -->
  <div class="modal-backdrop" *ngIf="isModalOpen" (click)="closeModal()">
    <div class="modal-content" (click)="$event.stopPropagation()">
      <app-task-form
        [task]="selectedTask"
        (submit)="handleTaskSubmit($event)"
        (cancel)="closeModal()"
      ></app-task-form>
    </div>
  </div>

</div>
